<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Road Safety Simulation</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:#87ceeb;
}

#app{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
}

#title{
    position:absolute;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 25px;
    border-radius:30px;
    background:rgba(255,255,255,.94);
    color:#26313a;
    font-size:17px;
    font-weight:800;
    letter-spacing:.2px;
    box-shadow:0 10px 35px rgba(0,0,0,.18);
    z-index:20;
    white-space:nowrap;
}

#telemetry{
    position:absolute;
    left:18px;
    top:18px;
    width:245px;
    padding:18px;
    border-radius:20px;
    background:rgba(255,255,255,.94);
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    backdrop-filter:blur(12px);
    z-index:20;
}

.telemetry-title{
    font-size:16px;
    font-weight:800;
    margin-bottom:15px;
}

.row{
    margin-bottom:12px;
}

.label{
    font-size:8px;
    color:#8b9299;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.value{
    margin-top:4px;
    font-size:14px;
    color:#29313a;
    font-weight:750;
}

.badge{
    display:inline-block;
    margin-top:4px;
    padding:6px 12px;
    border-radius:20px;
    font-size:10px;
    font-weight:850;
}

#controls{
    position:absolute;
    right:18px;
    top:18px;
    width:255px;
    padding:17px;
    border-radius:20px;
    background:rgba(255,255,255,.94);
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    backdrop-filter:blur(12px);
    z-index:20;
}

.control-title{
    font-size:16px;
    font-weight:800;
    color:#29313a;
    margin-bottom:13px;
}

button{
    width:100%;
    border:none;
    padding:10px 12px;
    margin-bottom:7px;
    border-radius:11px;
    background:#eef2f5;
    color:#303840;
    font-size:11px;
    font-weight:750;
    cursor:pointer;
    transition:.15s ease;
}

button:hover{
    transform:translateY(-2px);
    background:#dfe7ed;
}

button:active{
    transform:scale(.97);
}

#reset{
    background:#29313a;
    color:white;
}

#weather{
    position:absolute;
    top:170px;
    right:292px;
    width:310px;
    padding:17px;
    border-radius:19px;
    background:rgba(255,255,255,.96);
    box-shadow:0 15px 45px rgba(0,0,0,.22);
    z-index:25;
    opacity:0;
    transform:translateX(20px);
    pointer-events:none;
    transition:.3s;
}

#weather.show{
    opacity:1;
    transform:translateX(0);
}

#weatherIcon{
    font-size:30px;
}

#weatherTitle{
    font-size:17px;
    font-weight:850;
    margin-top:4px;
}

#weatherText{
    margin-top:7px;
    color:#626b73;
    font-size:11px;
    line-height:1.5;
}

#weatherSpeed{
    display:inline-block;
    margin-top:11px;
    padding:7px 11px;
    border-radius:15px;
    background:#fff0ce;
    color:#946000;
    font-size:10px;
    font-weight:850;
}

#message{
    position:absolute;
    bottom:34px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    padding:11px 20px;
    border-radius:25px;
    background:rgba(24,29,34,.93);
    color:white;
    font-size:12px;
    font-weight:750;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
    z-index:30;
    opacity:0;
    transition:.25s;
    white-space:nowrap;
}

#message.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

#hint{
    position:absolute;
    bottom:12px;
    right:18px;
    color:rgba(255,255,255,.8);
    font-size:9px;
    z-index:10;
}

</style>

</head>

<body>

<div id="app">

<div id="canvas"></div>

<div id="title">
🚗 AI ROAD SAFETY • PREDICT • PREVENT • PROTECT
</div>

<div id="telemetry">

    <div class="telemetry-title">
        Vehicle Telemetry
    </div>

    <div class="row">
        <div class="label">Vehicle</div>
        <div class="value">SMART-CAR 01</div>
    </div>

    <div class="row">
        <div class="label">Speed</div>
        <div class="value">
            <span id="speed">50</span> km/h
        </div>
    </div>

    <div class="row">
        <div class="label">Lane</div>
        <div class="value" id="lane">
            RIGHT LANE
        </div>
    </div>

    <div class="row">
        <div class="label">Risk Level</div>
        <div>
            <span class="badge" id="risk">FINE</span>
        </div>
    </div>

    <div class="row">
        <div class="label">Detected Event</div>
        <div class="value" id="event">
            CLEAR
        </div>
    </div>

    <div class="row">
        <div class="label">AI Status</div>
        <div>
            <span class="badge" id="status">
                DRIVING
            </span>
        </div>
    </div>

</div>

<div id="controls">

    <div class="control-title">
        🛡️ Prevention Scenarios
    </div>

    <button onclick="startScenario('human')">
        🧍 Pedestrian Crossing
    </button>

    <button onclick="startScenario('animal')">
        🐕 Animal Crossing
    </button>

    <button onclick="startScenario('obstacle')">
        🚧 Road Obstruction
    </button>

    <button onclick="startScenario('collision')">
        🚗 Collision Risk
    </button>

    <button onclick="startScenario('rain')">
        🌧️ Heavy Rain
    </button>

    <button onclick="startScenario('storm')">
        ⛈️ Severe Storm
    </button>

    <button id="reset" onclick="resetSimulation()">
        ↻ Reset Simulation
    </button>

</div>

<div id="weather">

    <div id="weatherIcon"></div>

    <div id="weatherTitle"></div>

    <div id="weatherText"></div>

    <div id="weatherSpeed"></div>

</div>

<div id="message"></div>

<div id="hint">
Drag to rotate camera • Scroll to zoom
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x91d8ff);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        52,
        window.innerWidth / window.innerHeight,
        .1,
        1000
    );

camera.position.set(
    10,
    7.5,
    18
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("canvas")
    .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(
        0xdff5ff,
        0x597553,
        2.8
    );

scene.add(hemisphere);


const sunlight =
    new THREE.DirectionalLight(
        0xfff4d0,
        3.4
    );

sunlight.position.set(
    -25,
    35,
    20
);

sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.left=-40;
sunlight.shadow.camera.right=40;
sunlight.shadow.camera.top=40;
sunlight.shadow.camera.bottom=-40;

scene.add(sunlight);


/* =========================================================
   SUN
========================================================= */

const sunMesh =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            3.5,
            32,
            32
        ),
        new THREE.MeshBasicMaterial({
            color:0xffefaa
        })
    );

sunMesh.position.set(
    -30,
    28,
    -80
);

scene.add(sunMesh);


/* =========================================================
   GROUND
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            500,
            500
        ),
        new THREE.MeshStandardMaterial({
            color:0x83c879,
            roughness:1
        })
    );

ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   ROAD
========================================================= */

const road =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            12,
            .2,
            500
        ),
        new THREE.MeshStandardMaterial({
            color:0x30343a,
            roughness:.75,
            metalness:.05
        })
    );

road.receiveShadow=true;

scene.add(road);


/* =========================================================
   ROAD SHOULDERS
========================================================= */

function addRoadShoulder(x){

    const shoulder =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .8,
                .035,
                500
            ),
            new THREE.MeshStandardMaterial({
                color:0xb7b9a9,
                roughness:1
            })
        );

    shoulder.position.set(
        x,
        .12,
        0
    );

    scene.add(shoulder);
}

addRoadShoulder(-6);
addRoadShoulder(6);


/* =========================================================
   ROAD EDGE LINES
========================================================= */

function addRoadLine(x){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .16,
                .06,
                500
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff
            })
        );

    line.position.set(
        x,
        .16,
        0
    );

    scene.add(line);
}

addRoadLine(-5.55);
addRoadLine(5.55);


/* =========================================================
   CENTER DASHES
========================================================= */

const centerMarkers=[];

for(
    let z=-250;
    z<250;
    z+=8
){

    const marker =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .12,
                .06,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff
            })
        );

    marker.position.set(
        0,
        .17,
        z
    );

    scene.add(marker);

    centerMarkers.push(marker);
}


/* =========================================================
   LANES
========================================================= */

const LEFT=-3;
const RIGHT=3;

const LANES=[
    LEFT,
    RIGHT
];


/* =========================================================
   TREE CREATOR
========================================================= */

function createTree(x,z,scale=1){

    const tree =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .20,
                .32,
                2.4,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x795548,
                roughness:1
            })
        );

    trunk.position.y=1.2;
    trunk.castShadow=true;

    tree.add(trunk);

    const lower =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.25,
                16,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x3e9951,
                roughness:1
            })
        );

    lower.position.y=2.35;
    lower.castShadow=true;

    tree.add(lower);

    const middle =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.05,
                16,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x51a85e,
                roughness:1
            })
        );

    middle.position.set(
        -.45,
        3.2,
        0
    );

    middle.castShadow=true;

    tree.add(middle);

    const top =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .8,
                16,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x67b96d,
                roughness:1
            })
        );

    top.position.set(
        .35,
        3.65,
        0
    );

    top.castShadow=true;

    tree.add(top);

    tree.position.set(
        x,
        0,
        z
    );

    tree.scale.setScalar(scale);

    scene.add(tree);

    return tree;
}


const trees=[];


/* =========================================================
   ROAD SIDE TREES
========================================================= */

for(
    let z=-10;
    z>-340;
    z-=13
){

    trees.push(
        createTree(
            -8.5-Math.random()*2,
            z,
            .75+Math.random()*.45
        )
    );

    trees.push(
        createTree(
            8.5+Math.random()*2,
            z-5,
            .75+Math.random()*.45
        )
    );
}


/* =========================================================
   BUSH
========================================================= */

function createBush(x,z,scale=1){

    const bush =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .7,
                14,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x4d9f50,
                roughness:1
            })
        );

    bush.position.set(
        x,
        .5,
        z
    );

    bush.scale.set(
        1.4*scale,
        .8*scale,
        1.1*scale
    );

    bush.castShadow=true;

    scene.add(bush);

    return bush;
}


const bushes=[];

for(
    let z=-8;
    z>-320;
    z-=9
){

    bushes.push(
        createBush(
            -7.2,
            z,
            .55+Math.random()*.5
        )
    );

    bushes.push(
        createBush(
            7.2,
            z-3,
            .55+Math.random()*.5
        )
    );
}


/* =========================================================
   FLOWERS
========================================================= */

const flowers=[];

function createFlower(x,z){

    const flower =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .09,
                8,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0xffe28a
            })
        );

    flower.position.set(
        x,
        .18,
        z
    );

    scene.add(flower);

    return flower;
}


for(
    let z=-5;
    z>-300;
    z-=4
){

    flowers.push(
        createFlower(
            -6.65-Math.random()*.4,
            z
        )
    );

    flowers.push(
        createFlower(
            6.65+Math.random()*.4,
            z-1.5
        )
    );
}


/* =========================================================
   CLOUDS
========================================================= */

function createCloud(
    x,
    y,
    z,
    scale
){

    const cloud =
        new THREE.Group();

    const material =
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            roughness:1
        });

    const parts=[
        [-1.5,0,0,1],
        [-.6,.35,0,1.35],
        [.55,.25,0,1.15],
        [1.4,0,0,.85]
    ];

    parts.forEach(p=>{

        const puff =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    p[3],
                    16,
                    12
                ),
                material
            );

        puff.position.set(
            p[0],
            p[1],
            p[2]
        );

        cloud.add(puff);
    });

    cloud.position.set(
        x,
        y,
        z
    );

    cloud.scale.setScalar(scale);

    scene.add(cloud);

    return cloud;
}


const clouds=[];

clouds.push(
    createCloud(-20,17,-60,2.2)
);

clouds.push(
    createCloud(20,18,-120,1.8)
);

clouds.push(
    createCloud(-24,15,-200,1.6)
);

clouds.push(
    createCloud(25,17,-270,2)
);


/* =========================================================
   BUILDINGS
========================================================= */

function createBuilding(
    x,
    z,
    width,
    depth,
    height
){

    const building =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            new THREE.MeshStandardMaterial({
                color:0x7d8791,
                roughness:.85
            })
        );

    body.position.y =
        height/2;

    body.castShadow=true;
    body.receiveShadow=true;

    building.add(body);


    /* WINDOWS */

    const windowMat =
        new THREE.MeshStandardMaterial({
            color:0xbdebf5,
            emissive:0x416b75,
            emissiveIntensity:.35,
            roughness:.2
        });


    const windowWidth=.32;
    const windowHeight=.45;

    const spacingX=.75;
    const spacingY=.95;


    const columns =
        Math.max(
            1,
            Math.floor(
                (width-.6)/spacingX
            )
        );


    const rows =
        Math.max(
            1,
            Math.floor(
                (height-.8)/spacingY
            )
        );


    /* FRONT */

    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let col=0;
            col<columns;
            col++
        ){

            const w =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        windowWidth,
                        windowHeight,
                        .04
                    ),
                    windowMat
                );

            const startX =
                -((columns-1)*spacingX)/2;

            w.position.set(
                startX+col*spacingX,
                .65+row*spacingY,
                depth/2+.025
            );

            building.add(w);
        }
    }


    /* BACK */

    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let col=0;
            col<columns;
            col++
        ){

            const w =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        windowWidth,
                        windowHeight,
                        .04
                    ),
                    windowMat
                );

            const startX =
                -((columns-1)*spacingX)/2;

            w.position.set(
                startX+col*spacingX,
                .65+row*spacingY,
                -depth/2-.025
            );

            building.add(w);
        }
    }


    /* SIDES */

    const sideColumns =
        Math.max(
            1,
            Math.floor(
                (depth-.6)/spacingX
            )
        );


    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let col=0;
            col<sideColumns;
            col++
        ){

            const startZ =
                -((sideColumns-1)*spacingX)/2;


            const leftWindow =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .04,
                        windowHeight,
                        windowWidth
                    ),
                    windowMat
                );

            leftWindow.position.set(
                -width/2-.025,
                .65+row*spacingY,
                startZ+col*spacingX
            );

            building.add(leftWindow);


            const rightWindow =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .04,
                        windowHeight,
                        windowWidth
                    ),
                    windowMat
                );

            rightWindow.position.set(
                width/2+.025,
                .65+row*spacingY,
                startZ+col*spacingX
            );

            building.add(rightWindow);
        }
    }


    /* ROOF */

    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+.15,
                .18,
                depth+.15
            ),
            new THREE.MeshStandardMaterial({
                color:0x555d65,
                roughness:.9
            })
        );

    roof.position.y =
        height+.09;

    roof.castShadow=true;

    building.add(roof);


    building.position.set(
        x,
        0,
        z
    );

    scene.add(building);

    return building;
}


const buildings=[];


/* LEFT BUILDINGS */

for(
    let z=-30;
    z>-340;
    z-=35
){

    buildings.push(
        createBuilding(
            -14,
            z,
            5.5,
            11,
            9+Math.random()*8
        )
    );
}


/* RIGHT BUILDINGS */

for(
    let z=-45;
    z>-340;
    z-=40
){

    buildings.push(
        createBuilding(
            14,
            z,
            5.5,
            11,
            10+Math.random()*9
        )
    );
}


/* =========================================================
   STREET LIGHTS
========================================================= */

const streetLights=[];


function createStreetLight(x,z){

    const group =
        new THREE.Group();


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .08,
                .1,
                4,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x596168,
                metalness:.6,
                roughness:.4
            })
        );

    pole.position.y=2;

    group.add(pole);


    const arm =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .8,
                .08,
                .08
            ),
            new THREE.MeshStandardMaterial({
                color:0x596168
            })
        );

    arm.position.set(
        x<0 ? .35:-.35,
        4,
        0
    );

    group.add(arm);


    const lamp =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .16,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xfff0a8,
                emissive:0xffd85a,
                emissiveIntensity:1
            })
        );

    lamp.position.set(
        x<0 ? .7:-.7,
        3.92,
        0
    );

    group.add(lamp);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    return group;
}


for(
    let z=-15;
    z>-330;
    z-=30
){

    streetLights.push(
        createStreetLight(
            -6.9,
            z
        )
    );

    streetLights.push(
        createStreetLight(
            6.9,
            z-15
        )
    );
}


/* =========================================================
   CAR CREATOR
========================================================= */

function createCar(
    color,
    isPlayer=false
){

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.75,
                .58,
                3.25
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                roughness:.3,
                metalness:.15
            })
        );

    body.position.y=.57;
    body.castShadow=true;

    car.add(body);


    const lower =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.9,
                .28,
                2.8
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                roughness:.35
            })
        );

    lower.position.y=.38;

/* =========================================================
   VEHICLE SAFETY
========================================================= */

function vehicleSafeInLane(
    lane,
    ourZ
){

    for(const car of traffic){

        if(
            Math.abs(
                car.mesh.position.x-lane
            ) > SIDE_MARGIN
        ){
            continue;
        }


        const dz =
            car.mesh.position.z-ourZ;


        if(
            dz < 0 &&
            dz > -FRONT_DISTANCE
        ){
            return false;
        }


        if(
            dz > 0 &&
            dz < REAR_DISTANCE
        ){
            return false;
        }
    }


    return true;
}


/* =========================================================
   OBJECT SAFETY
========================================================= */

function objectSafeInLane(
    lane,
    ourZ
){

    if(
        obstacle &&
        obstacle.visible
    ){

        if(
            Math.abs(
                obstacle.position.x-lane
            ) < 1.7
        ){

            const dz =
                obstacle.position.z-ourZ;

            if(
                dz < 0 &&
                dz > -FRONT_DISTANCE
            ){

                return false;
            }
        }
    }


    if(pedestrian){

        if(
            Math.abs(
                pedestrian.position.x-lane
            ) < 1.8
        ){

            const dz =
                pedestrian.position.z-ourZ;

            if(
                dz < 0 &&
                dz > -20
            ){

                return false;
            }
        }
    }


    if(animal){

        if(
            Math.abs(
                animal.position.x-lane
            ) < 1.8
        ){

            const dz =
                animal.position.z-ourZ;

            if(
                dz < 0 &&
                dz > -20
            ){

                return false;
            }
        }
    }


    return true;
}


/* =========================================================
   COMPLETE SAFETY CHECK
========================================================= */

function laneIsSafe(lane){

    const ourZ =
        smartCar.position.z;

    return (
        vehicleSafeInLane(
            lane,
            ourZ
        )
        &&
        objectSafeInLane(
            lane,
            ourZ
        )
    );
}


/* =========================================================
   PREDICTIVE SAFETY
========================================================= */

function laneWillRemainSafe(lane){

    const ourZ =
        smartCar.position.z;


    for(const car of traffic){

        if(
            Math.abs(
                car.mesh.position.x-lane
            ) > SIDE_MARGIN
        ){
            continue;
        }


        const predicted =
            car.mesh.position.z +
            car.speed *
            .12 *
            1.2;


        const dz =
            predicted-ourZ;


        if(
            dz < 0 &&
            dz > -28
        ){

            return false;
        }


        if(
            dz > 0 &&
            dz < 14
        ){

            return false;
        }
    }


    return laneIsSafe(lane);
}


/* =========================================================
   FIND SAFE LANE
========================================================= */

function findSafeLane(){

    const otherLane =
        currentLane===RIGHT
        ? LEFT
        : RIGHT;


    if(
        laneWillRemainSafe(
            otherLane
        )
    ){

        return otherLane;
    }


    return null;
}


/* =========================================================
   BEGIN LANE CHANGE
========================================================= */

function beginLaneChange(){

    if(laneChanging){
        return true;
    }


    if(avoidanceLocked){
        return false;
    }


    const safeLane =
        findSafeLane();


    if(safeLane===null){

        return false;
    }


    targetLane=
        safeLane;

    laneChanging=true;

    avoidanceLocked=true;

    return true;
}


/* =========================================================
   UPDATE LANE CHANGE
========================================================= */

function updateLaneChange(delta){

    if(!laneChanging){
        return;
    }


    if(
        !laneIsSafe(targetLane)
    ){

        laneChanging=false;

        targetLane=null;

        targetSpeed=3;

        setStatus(
            "BRAKING",
            "LANE BLOCKED",
            "HIGH"
        );

        showMessage(
            "⚠️ Unsafe lane detected — emergency braking"
        );

        return;
    }


    const dx =
        targetLane-
        smartCar.position.x;


    smartCar.position.x +=
        dx*
        Math.min(
            delta*3.2,
            1
        );


    /*
        Smoother visual banking.
    */

    const desiredTilt =
        -dx*.055;

    smartCar.rotation.z +=
        (
            desiredTilt-
            smartCar.rotation.z
        )*
        Math.min(
            delta*10,
            1
        );


    if(
        Math.abs(dx)<.06
    ){

        smartCar.position.x=
            targetLane;

        currentLane=
            targetLane;

        laneChanging=false;

        targetLane=null;

        smartCar.rotation.z=0;

        avoidanceLocked=false;

        updateLaneUI();
    }
}


/* =========================================================
   RETURN TO ORIGINAL LANE
========================================================= */

function tryReturnToOriginal(){

    if(
        currentLane===originalLane
    ){

        return true;
    }


    if(
        !laneIsSafe(originalLane)
    ){

        targetSpeed=18;

        return false;
    }


    if(
        !laneWillRemainSafe(originalLane)
    ){

        targetSpeed=18;

        return false;
    }


    targetLane=
        originalLane;

    laneChanging=true;

    avoidanceLocked=true;

    return true;
}


/* =========================================================
   SPEED
========================================================= */

function updateSpeed(delta){

    currentSpeed +=
        (
            targetSpeed-currentSpeed
        )*
        Math.min(
            delta*3,
            1
        );


    document.getElementById(
        "speed"
    ).textContent=
        Math.max(
            0,
            Math.round(currentSpeed)
        );
}


/* =========================================================
   TRAFFIC MOVEMENT
========================================================= */

function updateTraffic(delta){

    traffic.forEach(car=>{

        car.mesh.position.z +=
            car.speed*
            delta*
            .12;


        /*
            Wheel animation.
        */

        if(car.mesh.userData.wheels){

            car.mesh.userData.wheels.forEach(
                wheel=>{

                    wheel.rotation.x +=
                        car.speed*
                        delta*
                        .35;
                }
            );
        }


        /*
            Very subtle suspension.
        */

        car.mesh.position.y =
            Math.sin(
                performance.now()*.004+
                car.mesh.position.z
            )*.008;


        if(
            car.mesh.position.z>35
        ){

            let farthest=-60;


            traffic.forEach(other=>{

                if(other!==car){

                    farthest=
                        Math.min(
                            farthest,
                            other.mesh.position.z
                        );
                }
            });


            car.mesh.position.z=
                farthest-
                45-
                Math.random()*35;


            car.lane=
                LANES[
                    Math.floor(
                        Math.random()*LANES.length
                    )
                ];


            car.mesh.position.x=
                car.lane;


            car.speed=
                16+
                Math.random()*5;

            car.baseSpeed=
                car.speed;
        }
    });
}


/* =========================================================
   PEDESTRIAN
========================================================= */

function updatePedestrian(delta){

    if(!pedestrian){
        return;
    }


    /*
        Pedestrian movement is independent
        from vehicle speed.
    */

    pedestrian.position.z +=
        1.5*
        delta;


    pedestrian.position.x -=
        delta*1.8;


    /*
        Walking animation.
    */

    const walk =
        Math.sin(
            scenarioTime*9
        );


    if(
        pedestrian.userData.legs
    ){

        pedestrian.userData.legs[0]
            .rotation.z=
            walk*.35;

        pedestrian.userData.legs[1]
            .rotation.z=
            -walk*.35;
    }


    pedestrian.position.y =
        Math.abs(
            Math.sin(
                scenarioTime*9
            )
        )*.025;


    pedestrian.rotation.z=
        Math.sin(
            scenarioTime*8
        )*.04;
}


/* =========================================================
   ANIMAL
========================================================= */

function updateAnimal(delta){

    if(!animal){
        return;
    }


    /*
        Animal moves independently from
        the vehicle speed.
    */

    animal.position.z +=
        1.5*
        delta;


    animal.position.x -=
        delta*1.8;


    /*
        Walking animation.
    */

    const walk =
        Math.sin(
            scenarioTime*10
        );


    if(
        animal.userData.legs
    ){

        animal.userData.legs.forEach(
            (leg,index)=>{

                leg.rotation.z=
                    index%2===0
                    ? walk*.3
                    : -walk*.3;
            }
        );
    }


    animal.position.y =
        Math.abs(
            Math.sin(
                scenarioTime*10
            )
        )*.018;


    animal.rotation.y =
        Math.sin(
            scenarioTime*7
        )*.08;
}


/* =========================================================
   RAIN
========================================================= */

function updateRain(delta){

    if(
        !rain ||
        !rain.visible
    ){
        return;
    }


    const pos =
        rain.geometry
        .attributes
        .position
        .array;


    for(
        let i=0;
        i<pos.length;
        i+=3
    ){

        pos[i+1]-=
            delta*30;


        pos[i+2]+=
            delta*5;


        pos[i]+=
            delta*.5;


        if(
            pos[i+1]<0
        ){

            pos[i+1]=30;

            pos[i]=
                (Math.random()-.5)*45;

            pos[i+2]=
                (Math.random()-.5)*140;
        }
    }


    rain.geometry
        .attributes
        .position
        .needsUpdate=true;
}


/* =========================================================
   HUMAN SCENARIO
========================================================= */

function updateHumanScenario(delta){

    scenarioTime+=delta;

    updatePedestrian(delta);


    if(
        scenarioTime<1.5
    ){

        targetSpeed=30;

        setStatus(
            "DETECTING",
            "PEDESTRIAN",
            "MEDIUM"
        );

        return;
    }


    /*
        STOP instead of changing lanes.
    */

    if(
        scenarioTime<3
    ){

        targetSpeed=0;

        setStatus(
            "BRAKING",
            "PEDESTRIAN",
            "HIGH"
        );

        return;
    }


    /*
        Keep stopped until pedestrian
        has cleared the road.
    */

    if(
        pedestrian &&
        pedestrian.position.x>-7 &&
        pedestrian.position.z<12
    ){

        targetSpeed=0;

        setStatus(
            "STOPPED",
            "PEDESTRIAN CROSSING",
            "HIGH"
        );

        return;
    }


    /*
        Pedestrian is clear.
    */

    if(
        pedestrian &&
        (
            pedestrian.position.x<=-7 ||
            pedestrian.position.z>=12
        )
    ){

        targetSpeed=35;

        setStatus(
            "RESUMING",
            "PEDESTRIAN CLEAR",
            "LOW"
        );

        showMessage(
            "✓ Pedestrian cleared — resuming safely"
        );

        pedestrian.position.x=-20;

        return;
    }


    if(
        scenarioTime<20
    ){

        targetSpeed=35;

        setStatus(
            "DRIVING",
            "PEDESTRIAN CLEAR",
            "LOW"
        );

        return;
    }


    finishScenario();
}


/* =========================================================
   ANIMAL SCENARIO
========================================================= */

function updateAnimalScenario(delta){

    scenarioTime+=delta;

    updateAnimal(delta);


    if(
        scenarioTime<1.5
    ){

        targetSpeed=30;

        setStatus(
            "DETECTING",
            "ANIMAL",
            "MEDIUM"
        );

        return;
    }


    /*
        Brake.
    */

    if(
        scenarioTime<3
    ){

        targetSpeed=0;

        setStatus(
            "BRAKING",
            "ANIMAL",
            "HIGH"
        );

        return;
    }


    /*
        Stop until animal completely clears.
    */

    if(
        animal &&
        animal.position.x>-7 &&
        animal.position.z<12
    ){

        targetSpeed=0;

        setStatus(
            "STOPPED",
            "ANIMAL CROSSING",
            "HIGH"
        );

        return;
    }


    /*
        Animal has cleared the road.
    */

    if(
        animal &&
        (
            animal.position.x<=-7 ||
            animal.position.z>=12
        )
    ){

        targetSpeed=35;

        setStatus(
            "RESUMING",
            "ANIMAL CLEAR",
            "LOW"
        );

        showMessage(
            "✓ Animal cleared — resuming safely"
        );

        animal.position.x=-20;

        return;
    }


    if(
        scenarioTime<20
    ){

        targetSpeed=35;

        setStatus(
            "DRIVING",
            "ANIMAL CLEAR",
            "LOW"
        );

        return;
    }


    finishScenario();
}


/* =========================================================
   OBSTACLE SCENARIO
========================================================= */

function updateObstacleScenario(delta){

    scenarioTime+=delta;


    if(!obstacle){
        return;
    }


    obstacle.position.z +=
        currentSpeed*
        delta*
        .12;


    if(
        scenarioTime<2
    ){

        targetSpeed=27;

        setStatus(
            "DETECTING",
            "OBSTRUCTION",
            "MEDIUM"
        );

        return;
    }


    if(
        scenarioTime<3.5
    ){

        targetSpeed=7;

        setStatus(
            "BRAKING",
            "OBSTRUCTION",
            "HIGH"
        );

        return;
    }


    if(
        scenarioTime<6
    ){

        if(
            !laneChanging &&
            !avoidanceLocked
        ){

            if(
                beginLaneChange()
            ){

                showMessage(
                    "↪ Obstacle detected — alternate lane verified"
                );
            }
        }


        if(laneChanging){

            updateLaneChange(delta);

            targetSpeed=16;

            setStatus(
                "EVASIVE",
                "OBSTRUCTION",
                "HIGH"
            );

        }

        else if(
            !laneIsSafe(currentLane)
        ){

            targetSpeed=0;

            setStatus(
                "STOPPED",
                "NO SAFE LANE",
                "HIGH"
            );
        }

        return;
    }


    if(
        scenarioTime<11
    ){

        if(
            !laneIsSafe(currentLane)
        ){

            targetSpeed=5;

            setStatus(
                "BRAKING",
                "VEHICLE IN LANE",
                "HIGH"
            );

        }

        else{

            targetSpeed=29;

            setStatus(
                "AVOIDING",
                "OBSTRUCTION",
                "LOW"
            );
        }

        return;
    }


    if(
        scenarioTime<16
    ){

        if(!laneChanging){

            if(
                tryReturnToOriginal()
            ){

                targetSpeed=35;

                setStatus(
                    "RESUMING",
                    "SAFE ROAD",
                    "LOW"
                );

            }

            else{

                targetSpeed=22;

                setStatus(
                    "CAUTIOUS",
                    "WAITING FOR LANE",
                    "LOW"
                );
            }
        }


        if(laneChanging){

            updateLaneChange(delta);
        }

        return;
    }


    finishScenario();
}

========================================================= */

    ){

        setStatus(
            "CAUTIOUS",
            "HEAVY RAIN",

/* =========================================================
   FINISH SCENARIO
========================================================= */

function finishScenario(){

    if(eventFinished){
        return;
    }


    eventFinished=true;

    avoidanceLocked=false;

    laneChanging=false;

    targetLane=null;

    targetSpeed=50;


    setStatus(
        "DRIVING",
        "CLEAR",
        "FINE"
    );


    showMessage(
        "✓ Hazard cleared — normal driving resumed"
    );
}


/* =========================================================
   START SCENARIO
========================================================= */

function startScenario(scenario){

    resetSimulation();

    activeScenario=scenario;

    scenarioTime=0;

    eventFinished=false;


    if(
        scenario==="human"
    ){

        pedestrian=
            createPedestrian();


        pedestrian.position.set(
            -3.8,
            0,
            -25
        );


        setStatus(
            "DETECTING",
            "PEDESTRIAN",
            "MEDIUM"
        );


        showMessage(
            "🧍 Pedestrian detected ahead"
        );
    }


    else if(
        scenario==="animal"
    ){

        animal=
            createAnimal();


        animal.position.set(
            3.8,
            0,
            -25
        );


        setStatus(
            "DETECTING",
            "ANIMAL",
            "MEDIUM"
        );


        showMessage(
            "🐕 Animal detected ahead"
        );
    }


    else if(
        scenario==="obstacle"
    ){

        obstacle.visible=true;


        obstacle.position.set(
            RIGHT,
            0,
            -25
        );


        setStatus(
            "DETECTING",
            "OBSTRUCTION",
            "MEDIUM"
        );


        showMessage(
            "🚧 Road obstruction detected"
        );
    }


    else if(
        scenario==="collision"
    ){

        const danger=
            traffic[1];


        danger.lane=
            RIGHT;


        danger.mesh.position.set(
            RIGHT,
            0,
            -30
        );


        danger.speed=22;


        setStatus(
            "PREDICTING",
            "COLLISION",
            "HIGH"
        );


        showMessage(
            "🚨 Collision trajectory detected"
        );
    }


    else if(
        scenario==="rain"
    ){

        rain.visible=true;


        scene.background=
            new THREE.Color(
                0x7595aa
            );


        showWeather("rain");


        setStatus(
            "CAUTIOUS",
            "HEAVY RAIN",
            "MEDIUM"
        );
    }


    else if(
        scenario==="storm"
    ){

        rain.visible=true;

        rain.material.opacity=.95;


        scene.background=
            new THREE.Color(
                0x414d5b
            );


        showWeather("storm");


        setStatus(
            "CAUTION",
            "SEVERE STORM",
            "HIGH"
        );
    }
}


/* =========================================================
   RESET
========================================================= */

function resetSimulation(){

    activeScenario="normal";

    scenarioTime=0;

    currentSpeed=50;

    targetSpeed=50;

    currentLane=RIGHT;

    originalLane=RIGHT;

    targetLane=null;

    laneChanging=false;

    avoidanceLocked=false;

    eventFinished=false;

    stormFlash=0;


    hideWeather();


    if(pedestrian){

        scene.remove(
            pedestrian
        );

        pedestrian=null;
    }


    if(animal){

        scene.remove(
            animal
        );

        animal=null;
    }


    obstacle.visible=false;


    rain.visible=false;

    rain.material.opacity=.8;


    scene.background=
        new THREE.Color(
            0x91d8ff
        );


    smartCar.position.set(
        RIGHT,
        0,
        0
    );


    smartCar.rotation.set(
        0,
        0,
        0
    );


    const resetPositions=[
        -70,
        -125,
        -180,
        -235,
        -285
    ];


    const resetSpeeds=[
        17,
        19,
        18,
        17,
        20
    ];


    const resetLanes=[
        LEFT,
        RIGHT,
        LEFT,
        RIGHT,
        LEFT
    ];


    traffic.forEach(
        (car,i)=>{

            car.mesh.position.z=
                resetPositions[i];

            car.mesh.position.x=
                resetLanes[i];

            car.mesh.position.y=0;

            car.lane=
                resetLanes[i];

            car.speed=
                resetSpeeds[i];

            car.baseSpeed=
                resetSpeeds[i];

            car.mesh.rotation.set(
                0,
                0,
                0
            );
        }
    );


    setStatus(
        "DRIVING",
        "CLEAR",
        "FINE"
    );


    updateLaneUI();
}


/* =========================================================
   ENVIRONMENT MOVEMENT
========================================================= */

function moveObjectForward(
    object,
    speed,
    delta,
    recycleDistance
){

    object.position.z +=
        speed*
        delta*
        .12;


    if(
        object.position.z>
        recycleDistance
    ){

        object.position.z -=
            350;
    }
}


/* =========================================================
   ENVIRONMENT
========================================================= */

function updateEnvironment(delta){

    /*
        Trees
    */

    trees.forEach(tree=>{

        moveObjectForward(
            tree,
            currentSpeed,
            delta,
            30
        );


        /*
            Very subtle wind.
        */

        tree.rotation.z=
            Math.sin(
                scenarioTime*.8+
                tree.position.z*.03
            )*.008;
    });


    /*
        Bushes
    */

    bushes.forEach(bush=>{

        moveObjectForward(
            bush,
            currentSpeed,
            delta,
            30
        );

    });


    /*
        Flowers
    */

    flowers.forEach(flower=>{

        moveObjectForward(
            flower,
            currentSpeed,
            delta,
            30
        );

    });


    /*
        Street lights
    */

    streetLights.forEach(light=>{

        moveObjectForward(
            light,
            currentSpeed,
            delta,
            35
        );

    });


    /*
        BUILDINGS
        These now move exactly like the other
        roadside environment objects.
    */

    buildings.forEach(building=>{

        moveObjectForward(
            building,
            currentSpeed,
            delta,
            45
        );

    });


    /*
        Center road markings.
    */

    centerMarkers.forEach(marker=>{

        marker.position.z +=
            currentSpeed*
            delta*
            .12;


        if(
            marker.position.z>30
        ){

            marker.position.z-=500;
        }
    });


    /*
        Clouds move slowly.
    */

    clouds.forEach(cloud=>{

        cloud.position.x +=
            delta*.08;


        if(
            cloud.position.x>40
        ){

            cloud.position.x=-40;
        }
    });
}


/* =========================================================
   PLAYER VISUAL ANIMATION
========================================================= */

function updatePlayerAnimation(delta){

    /*
        Wheel rotation.
        Visual only — does NOT affect safety.
    */

    if(
        smartCar.userData.wheels
    ){

        smartCar.userData.wheels.forEach(
            wheel=>{

                wheel.rotation.x +=
                    currentSpeed*
                    delta*
                    .35;
            }
        );
    }


    /*
        Gentle suspension movement.
    */

    const drivingAmount =
        Math.min(
            currentSpeed/50,
            1
        );


    const suspension =
        Math.sin(
            performance.now()*.008
        )*
        .012*
        drivingAmount;


    smartCar.position.y=
        suspension;


    /*
        Cabin gives a subtle floating effect.
    */

    const cabin=
        smartCar.children.find(
            child=>
                child.geometry &&
                child.geometry.parameters &&
                child.geometry.parameters.width===1.35
        );


    if(cabin){

        cabin.position.y=
            1.02+
            Math.sin(
                performance.now()*.006
            )*.006*
            drivingAmount;
    }


    /*
        Sensor ring pulse.
    */

    if(
        smartCar.userData.sensorRing
    ){

        smartCar.userData.sensorRing.material.opacity=
            .22+
            Math.sin(
                performance.now()*.004
            )*.08;
    }
}


/* =========================================================
   STORM VISUAL EFFECT
========================================================= */

function updateStorm(delta){

    if(
        activeScenario!=="storm"
    ){

        sunlight.intensity=
            3.4;

        return;
    }


    /*
        Random lightning flash.
        Purely visual.
        Does NOT affect vehicle logic.
    */

    if(
        Math.random()<delta*.45
    ){

        stormFlash=.12;
    }


    if(stormFlash>0){

        sunlight.intensity=
            5.5;

        hemisphere.intensity=
            4.2;

        stormFlash-=delta;

    }

    else{

        sunlight.intensity=
            1.5;

        hemisphere.intensity=
            1.8;
    }
}


/* =========================================================
   CAMERA
========================================================= */

let cameraAngle=0;

let cameraDistance=18;

let cameraHeight=7.5;

let dragging=false;

let lastMouseX=0;

let lastMouseY=0;

let smoothCameraX=camera.position.x;

let smoothCameraY=camera.position.y;

let smoothCameraZ=camera.position.z;


renderer.domElement.addEventListener(
    "mousedown",
    e=>{

        dragging=true;

        lastMouseX=e.clientX;

        lastMouseY=e.clientY;
    }
);


window.addEventListener(
    "mouseup",
    ()=>{

        dragging=false;
    }
);


window.addEventListener(
    "mousemove",
    e=>{

        if(!dragging){
            return;
        }


        const dx=
            e.clientX-lastMouseX;

        const dy=
            e.clientY-lastMouseY;


        cameraAngle-=
            dx*.005;


        cameraHeight-=
            dy*.025;


        cameraHeight=
            Math.max(
                4.5,
                Math.min(
                    12,
                    cameraHeight
                )
            );


        lastMouseX=
            e.clientX;

        lastMouseY=
            e.clientY;
    }
);


renderer.domElement.addEventListener(
    "wheel",
    e=>{

        cameraDistance+=
            e.deltaY*.012;


        cameraDistance=
            Math.max(
                11,
                Math.min(
                    30,
                    cameraDistance
                )
            );
    }
);


/* =========================================================
   MAIN ANIMATION
========================================================= */

let previousTime=
    performance.now();


function animate(){

    requestAnimationFrame(
        animate
    );


    const now=
        performance.now();


    const delta=
        Math.min(
            (now-previousTime)/1000,
            .05
        );


    previousTime=now;


    /*
        TRAFFIC
    */

    updateTraffic(delta);


    /*
        ENVIRONMENT
    */

    updateEnvironment(delta);


    /*
        RAIN
    */

    updateRain(delta);


    /*
        STORM VISUALS
    */

    updateStorm(delta);


    /*
        PLAYER VISUALS
    */

    updatePlayerAnimation(delta);


    /*
        SCENARIO LOGIC
    */

    if(
        activeScenario==="human"
    ){

        updateHumanScenario(delta);
    }

    else if(
        activeScenario==="animal"
    ){

        updateAnimalScenario(delta);
    }

    else if(
        activeScenario==="obstacle"
    ){

        updateObstacleScenario(delta);
    }

    else if(
        activeScenario==="collision"
    ){

        updateCollisionScenario(delta);
    }

    else if(
        activeScenario==="rain" ||
        activeScenario==="storm"
    ){

        updateWeatherScenario();
    }


    /*
        SPEED
    */

    updateSpeed(delta);


    /*
        SMART CAR STAYS AT Z=0.
    */

    smartCar.position.z=0;


    /*
        CAMERA TARGET
    */

    const targetCameraX=
        smartCar.position.x+
        Math.sin(cameraAngle)*
        cameraDistance;


    const targetCameraY=
        cameraHeight;


    const targetCameraZ=
        Math.cos(cameraAngle)*
        cameraDistance;


    /*
        Smooth camera interpolation.
    */

    smoothCameraX+=
        (
            targetCameraX-
            smoothCameraX
        )*
        Math.min(
            delta*6,
            1
        );


    smoothCameraY+=
        (
            targetCameraY-
            smoothCameraY
        )*
        Math.min(
            delta*6,
            1
        );


    smoothCameraZ+=
        (
            targetCameraZ-
            smoothCameraZ
        )*
        Math.min(
            delta*6,
            1
        );


    camera.position.x=
        smoothCameraX;

    camera.position.y=
        smoothCameraY;

    camera.position.z=
        smoothCameraZ;


    camera.lookAt(
        smartCar.position.x,
        .7,
        -6
    );


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   START
========================================================= */

resetSimulation();

animate();

</script>
